# Overridable with environment variables (env wins over this file):
#   LOAN_DB_URL, LOAN_DB_USER, LOAN_DB_PASSWORD
db.url=jdbc:mysql://localhost:3307/loandb?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Colombo&allowPublicKeyRetrieval=true&useSSL=false
db.user=loanapp
db.password=loanapp
db.pool.size=10

# Flyway runs automatically on startup; Hibernate only validates the result.
hibernate.hbm2ddl.auto=validate
hibernate.show_sql=false

# Where generated PDF/CSV reports are written (relative paths resolve to the
# working directory; the old app hardcoded C:\Program Files\...).
reports.dir=reports
